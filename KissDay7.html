<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Kiss Day 💋</title>

<style>
body{
  margin:0;
  font-family:"Poppins",sans-serif;
  background:linear-gradient(135deg,#ff4d6d,#ff758f,#ff8fa3);
  overflow-x:hidden;
  color:white;
  text-align:center;
}

/* Floating emojis */
.float{
  position:fixed;
  bottom:-40px;
  font-size:26px;
  animation:floatUp linear forwards;
  opacity:0.9;
}

@keyframes floatUp{
  0%{transform:translateY(0) scale(1);}
  70%{opacity:1;}
  100%{transform:translateY(-120vh) scale(1.8);opacity:0;}
}

.container{
  max-width:700px;
  margin:60px auto;
  padding:20px;
}

.card{
  background:rgba(255,255,255,0.15);
  padding:35px;
  border-radius:20px;
  backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

h1{font-size:2.8rem;margin-bottom:10px;}
p{font-size:1.2rem;}

.buttons{margin-top:25px;}

button{
  padding:14px 26px;
  font-size:1.1rem;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:.25s;
  margin:10px;
}

.yes{background:#ffe066;color:#000;}
.no{background:#ff6b6b;color:white;}

button:hover{transform:scale(1.05);}

#result{
  display:none;
  margin-top:25px;
  animation:fadeIn 1s ease;
}

#loveGif{
  width:260px;
  margin-top:15px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<script>
/* Floating emoji control */
let floatEmoji = "❤️";

function createFloat(){
  const el=document.createElement("div");
  el.className="float";
  el.innerHTML=floatEmoji;
  el.style.left=Math.random()*100+"vw";
  el.style.animationDuration=(Math.random()*3+4)+"s";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),7000);
}
setInterval(createFloat,400);

/* Grow YES button */
let yesScale = 1;

function growYes(){
  yesScale += 0.2;
  const yesBtn = document.getElementById("yesBtn");
  yesBtn.style.transform = `scale(${yesScale})`;
}

/* YES clicked */
function showLove(){

  // Reset size to original
  yesScale = 1;
  const yesBtn = document.getElementById("yesBtn");
  yesBtn.style.transform = "scale(1)";

  // Change floating emoji to devil smile
  floatEmoji = "😈";

  document.getElementById("result").style.display="block";
}
</script>

<div class="container">

  <div class="card">

    <h1>Happy Kiss Day 💋</h1>

    <p>
      Warning: Clicking YES may cause sudden romance,
      uncontrollable smiling, and suspicious happiness 😏
    </p>

    <h2>Can I steal a kiss from you? 😈</h2>

    <div class="buttons">
      <button id="yesBtn" class="yes" onclick="showLove()">Yes 😈</button>
      <button class="no" onclick="growYes()">Not Yet 🙈</button>
    </div>

    <div id="result">
      <h2>💋 Caught You 💋</h2>

      <p>
        Too late… now you owe me unlimited kisses,
        bonus cuddles, and premium affection forever.
      </p>

      <img id="loveGif"
           src="https://raw.githubusercontent.com/faruquecs/mdf1/main/Kiss.gif"
           alt="Kiss">

      <p>I regret nothing 😈❤️</p>
    </div>

  </div>

</div>

</body>
</html>

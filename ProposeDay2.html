<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Very Important Question ❤️</title>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
        overflow-x: hidden;
        color: white;
    }

    .card {
        background: rgba(255,255,255,0.12);
        padding: 40px 30px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        max-width: 500px;
        width: 90%;
        position: relative;
        margin: 40px 0;
    }

    h1 { margin-bottom: 10px; font-size: 2rem; }
    p { font-size: 1.1rem; }

    .buttons {
        margin-top: 30px;
        position: relative;
        height: 140px;
    }

    button {
        padding: 12px 25px;
        font-size: 1rem;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        position: absolute;
        transition: all 0.25s ease;
    }

    #yesBtn {
        background-color: #28a745;
        color: white;
        left: 25%;
    }

    #noBtn {
        background-color: #dc3545;
        color: white;
        left: 55%;
    }

    .hidden {
        display: none;
        margin-top: 20px;
        font-size: 1.2rem;
    }

    #loveGif {
        width: 200px;
        margin-top: 15px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .heart {
        position: fixed;
        font-size: 20px;
        animation: floatUp 3s linear forwards;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
    }
</style>
</head>

<body>

<div class="card">
    <h1>Hey Beautiful ❤️</h1>
    <p>
        Life with you is my favorite adventure.<br>
        So I have a very important question…
    </p>

    <h2>Will you always be mine?</h2>

    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
        <button id="noBtn">No 🙈</button>
    </div>

    <div id="result" class="hidden">
        <p>You just made me the happiest person alive ❤️<br>Forever starts with you.</p>

        <img id="loveGif"
             src="https://raw.githubusercontent.com/faruquecs/mdf1/main/Dudu.gif"
             alt="Cute Love GIF">
			 <br>
        <img id="loveGif"
             src="https://raw.githubusercontent.com/faruquecs/mdf1/main/us.png"
             alt="Cute Love GIF">
			 
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", moveButton);

function moveButton() {
    const x = Math.floor(Math.random() * 250) + 20;
    const y = Math.floor(Math.random() * 120) + 20;
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

function sayYes() {
    const result = document.getElementById("result");
    result.classList.remove("hidden");

    result.style.transform = "scale(0.5)";
    result.style.transition = "transform 0.4s ease";
    setTimeout(() => { result.style.transform = "scale(1)"; }, 50);

    for (let i = 0; i < 20; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.bottom = "0px";
        heart.style.fontSize = (Math.random() * 20 + 15) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 3000);
    }
}
</script>

</body>
</html>

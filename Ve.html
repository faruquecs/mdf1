<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Heart Hunt Console</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        background: radial-gradient(circle at top, #ffb3e6 0%, #2b002b 60%, #0b0015 100%);
        font-family: "Poppins", sans-serif;
        color: #fff;
        overflow: hidden;
    }

    h1 {
        margin-top: 20px;
        font-size: 40px;
        text-shadow: 0 0 18px #ff4fa3;
    }

    /* Floating background hearts */
    .bg-heart {
        position: fixed;
        font-size: 26px;
        opacity: 0.18;
        animation: floatUp 12s linear infinite;
        pointer-events: none;
    }

    @keyframes floatUp {
        0% { transform: translateY(100vh) translateX(0); opacity: 0; }
        10% { opacity: 0.25; }
        100% { transform: translateY(-20vh) translateX(-40px); opacity: 0; }
    }

    /* Glassmorphism console */
    .console {
        margin-top: 20px;
        width: 520px;
        padding: 24px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.35);
        box-shadow:
            0 0 40px rgba(255, 0, 120, 0.6),
            0 20px 40px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(18px);
    }

    .console-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
    }

    .console-title {
        font-size: 20px;
        letter-spacing: 1px;
        text-transform: uppercase;
        opacity: 0.9;
    }

    /* Heart progress bar */
    #heartBarContainer {
        width: 260px;
        height: 26px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.4);
    }

    #heartBarFill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ff0066, #ff9ad5);
        border-radius: 999px;
        display: flex;
        align-items: center;
        padding-left: 8px;
        font-size: 16px;
        color: #fff;
        transition: width 0.35s ease-out;
        white-space: nowrap;
    }

    .heart-label {
        font-size: 14px;
        opacity: 0.85;
    }

    /* Inner panel */
    .panel {
        margin-top: 12px;
        padding: 18px;
        border-radius: 20px;
        background: radial-gradient(circle at top left, #ffe6f7 0%, #ffb3dd 40%, #f28ac4 100%);
        box-shadow:
            inset 0 0 25px rgba(255, 255, 255, 0.7),
            inset 0 0 40px rgba(255, 0, 120, 0.35);
    }

    /* Grid */
    .grid {
        width: 360px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(4, 80px);
        grid-gap: 16px;
    }

    /* 3D-ish tiles */
    .tile {
        width: 80px;
        height: 80px;
        background: linear-gradient(145deg, #fff0f8, #ffc2e4);
        border-radius: 14px;
        box-shadow:
            0 8px 0 #c43a7a,
            0 14px 22px rgba(0, 0, 0, 0.35),
            inset 0 0 10px rgba(255, 255, 255, 0.7);
        cursor: pointer;
        font-size: 38px;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
    }

    .tile:hover {
        transform: translateY(-5px);
        box-shadow:
            0 11px 0 #a52c63,
            0 18px 26px rgba(0, 0, 0, 0.45);
    }

    .tile.revealed {
        background: #ffffff;
        transform: translateY(0);
        box-shadow:
            inset 0 0 18px rgba(0, 0, 0, 0.25);
        cursor: default;
    }

    /* Win / pun message */
    #message {
        margin-top: 22px;
        font-size: 28px;
        font-weight: 600;
        text-shadow: 0 0 14px #ff4fa3;
        display: none;
    }

    /* Confetti hearts burst */
    .burst-heart {
        position: fixed;
        font-size: 22px;
        animation: burst 1.1s ease-out forwards;
        pointer-events: none;
    }

    @keyframes burst {
        0%   { transform: translate(0, 0) scale(0.4); opacity: 1; }
        40%  { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 1; }
        100% { transform: translate(calc(var(--dx) * 1.4), calc(var(--dy) * 1.4)) scale(0.2); opacity: 0; }
    }
</style>
</head>
<body>

<h1>❤️ HeartCraft: You Auto‑Complete Me ❤️</h1>

<!-- Floating background hearts -->
<script>
    // create a few floating hearts in the background
    for (let i = 0; i < 15; i++) {
        const h = document.createElement("div");
        h.className = "bg-heart";
        h.textContent = "❤️";
        h.style.left = Math.random() * 100 + "vw";
        h.style.animationDelay = (Math.random() * 12) + "s";
        h.style.animationDuration = (10 + Math.random() * 10) + "s";
        document.body.appendChild(h);
    }
</script>

<div class="console">
    <div class="console-header">
        <div class="console-title">Valentine Console</div>
        <div class="heart-label">Collect 7 hearts, avoid 💣</div>
    </div>

    <div id="heartBarContainer">
        <div id="heartBarFill"></div>
    </div>

    <div class="panel">
        <div class="grid" id="grid"></div>
    </div>
</div>

<div id="message">
      <p>
        Congratulations… you have unlocked  
        Lifetime Partner Mode 💛  
        Unlimited hugs 🤗  
        Premium cuddles 🥰  
        And permanent access to my heart ❤️
      </p>

</div>

<script>
    const grid = document.getElementById("grid");
    const message = document.getElementById("message");
    const heartBarFill = document.getElementById("heartBarFill");

    const totalTiles = 16;
    const totalHearts = 14;
    const winAt = 7; // win when 7 hearts are found
    const totalBombs = 2;

    let heartsFound = 0;
    let gameOver = false;

    // random positions
    let positions = Array(totalTiles).fill("empty");

    // place hearts
    let heartPlaced = 0;
    while (heartPlaced < totalHearts) {
        const idx = Math.floor(Math.random() * totalTiles);
        if (positions[idx] === "empty") {
            positions[idx] = "heart";
            heartPlaced++;
        }
    }

    // place bombs
    let bombPlaced = 0;
    while (bombPlaced < totalBombs) {
        const idx = Math.floor(Math.random() * totalTiles);
        if (positions[idx] === "empty") {
            positions[idx] = "bomb";
            bombPlaced++;
        }
    }

    // create tiles
    positions.forEach(type => {
        const tile = document.createElement("div");
        tile.classList.add("tile");

        tile.addEventListener("click", () => {
            if (tile.classList.contains("revealed") || gameOver) return;

            tile.classList.add("revealed");

            if (type === "heart") {
                tile.textContent = "❤️";
                heartsFound++;

                // update heart bar
                const percent = Math.min(100, (heartsFound / winAt) * 100);
                heartBarFill.style.width = percent + "%";
                heartBarFill.textContent = "❤️".repeat(Math.min(heartsFound, winAt));

                if (heartsFound === winAt) {
                    winGame();
                }
            } else if (type === "bomb") {
                tile.textContent = "💣";
                loseGame();
            }
        });

        grid.appendChild(tile);
    });

    function winGame() {
        gameOver = true;
        message.style.display = "block";
        heartCelebration();
    }

    function loseGame() {
        gameOver = true;
        alert("💥 You hit a bomb—love can be explosive. Refresh to try again!");
        location.reload();
    }

    // unique celebration: radial heart/confetti burst from center
    function heartCelebration() {
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2;

        for (let i = 0; i < 40; i++) {
            const h = document.createElement("div");
            h.className = "burst-heart";
            h.textContent = Math.random() > 0.5 ? "❤️" : "✨";

            const angle = (Math.PI * 2 * i) / 40;
            const distance = 80 + Math.random() * 80;
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance;

            h.style.left = centerX + "px";
            h.style.top = centerY + "px";
            h.style.setProperty("--dx", dx + "px");
            h.style.setProperty("--dy", dy + "px");

            document.body.appendChild(h);
            setTimeout(() => h.remove(), 1100);
        }
    }
</script>

</body>
</html>
